<table class="table">
    <thead>
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Nombre</th>
        <th scope="col">Precio</th>
        <th scope="col">Editar</th>
        <th scope="col">Borrar</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let producto of productos"> <!-- Corrección aquí -->
        <td>{{producto.id}}</td>
        <td>{{producto.nombre}}</td>
        <td>{{producto.precio}}</td>
        <td>
            <button class="btn btn-outline-warning" [routerLink]="['/editar', producto.id]">
              <i class="fa-solid fa-pen-to-square"></i> Editar
            </button>
          </td>
          <td>
            <button class="btn btn-outline-danger" (click)="borrar(producto.id)">
              <i class="fa-solid fa-trash-can"></i> Eliminar
            </button>
          </td>
          
      </tr>
    </tbody>
  </table>
